name: Super HeartGold native platform (Windows)
on:
  push:
    paths:
      - 'games/super-heartgold/**'
      - '.github/workflows/super-heartgold-windows.yml'
  pull_request:
    paths:
      - 'games/super-heartgold/**'
      - '.github/workflows/super-heartgold-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: games/super-heartgold
jobs:
  native-platform:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 (no ROM or emulator)
        run: cmake -S . -B build -A x64 -DHG_FETCH_SDL3=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test platform foundation
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: SuperHeartGold-platform-windows-x64
          path: games/super-heartgold/build/bin/Release/SuperHeartGold.exe
  title-flow-source:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure original title C and SDL in temporary private build (no ROM)
        run: cmake -S . -B "${{ runner.temp }}/hg-title-flow" -A x64 -DHG_REFERENCE_TITLE_FLOW=ON -DHG_REFERENCE_TEXT_FLOW=ON -DHG_FETCH_SDL3=ON
      - name: Build original decision and host adapters
        run: cmake --build "${{ runner.temp }}/hg-title-flow" --config Release --parallel 3
      - name: Test original decisions, host core and synthetic SDL font pages
        run: ctest --test-dir "${{ runner.temp }}/hg-title-flow" -C Release --output-on-failure
      # No original source, private executable or game resource is uploaded.
